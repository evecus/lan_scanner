name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'LAN Scanner release'

jobs:
  build-android:
    name: Build Android APK (arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Let Flutter generate gradlew + gradle-wrapper.jar into android/
      - name: Generate Android gradle wrapper
        run: |
          cd android
          flutter pub get 2>/dev/null || true
          # Flutter injects gradlew during build, but we can also get it via:
          gradle wrapper --gradle-version=8.3 2>/dev/null || true
          # If still missing, copy from Flutter SDK
          if [ ! -f gradlew ]; then
            FLUTTER_ROOT=$(flutter sdk-path)
            cp "$FLUTTER_ROOT/packages/flutter_tools/gradle/gradlew" . 2>/dev/null || \
            cp "$FLUTTER_ROOT/packages/flutter_tools/gradle/flutter.gradle" . 2>/dev/null || true
          fi
          ls -la
        continue-on-error: true

      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF

      # flutter build apk triggers Gradle internally and handles gradlew itself
      # The "Already watching path" crash happens AFTER Gradle succeeds
      # We capture exit code but don't fail on it
      - name: Build APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            2>&1 | tee /tmp/build.log
          echo "flutter exit: $?"
        continue-on-error: true

      - name: Locate APK
        run: |
          echo "=== All APK files ==="
          find . -name "*.apk" 2>/dev/null | sort

          APK=$(find . -name "*.apk" 2>/dev/null | grep -i "release" | grep -v debug | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | grep -v debug | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "=== Build log ==="
            cat /tmp/build.log
            exit 1
          fi

          echo "Found: $APK ($(du -sh $APK | cut -f1))"
          mkdir -p output
          cp "$APK" output/lan_scanner-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: output/lan_scanner-arm64.apk
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/


      - name: Create Git tag
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${{ github.event.inputs.tag }}`,
              sha: context.sha
            })

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: LAN Scanner ${{ github.event.inputs.tag }}
          body: |
            ## LAN Scanner ${{ github.event.inputs.tag }}

            ${{ github.event.inputs.release_notes }}

            | 文件 | 说明 |
            |------|------|
            | `lan_scanner-arm64.apk` | Android arm64 正式签名版 |
            | `LanScanner-unsigned.ipa` | iOS 未签名（AltStore/Sideloadly）|
          files: |
            artifacts/lan_scanner-arm64.apk
            artifacts/LanScanner-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
