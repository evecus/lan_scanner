name: Build APK & IPA

on:
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # Android APK build
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Build APK (universal)
        run: flutter build apk --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

  # ─────────────────────────────────────────────
  # Create GitHub Release on tag push
  # ─────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: artifacts/ios

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android/app-release.apk
            artifacts/android/app-arm64-v8a-release.apk
            artifacts/ios/LanScanner-unsigned.ipa
          body: |
            ## LAN Scanner Release

            ### Android
            - `app-release.apk` — 通用版（推荐）
            - `app-arm64-v8a-release.apk` — 64位 ARM（大多数现代手机）

            ### iOS
            - `LanScanner-unsigned.ipa` — 未签名，需自行签名后安装
              （使用 AltStore / Sideloadly / 企业证书）

            ### 功能
            - 输入 CIDR 网段扫描局域网设备
            - 自动检测当前 WiFi 网段
            - 支持自定义端口，默认扫描 13 个常用端口
            - 自动解析设备主机名
            - 结果可导出分享
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
