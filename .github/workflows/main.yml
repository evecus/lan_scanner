name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'LAN Scanner release'

jobs:
  build-android:
    name: Build Android APK (arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Decode keystore from GitHub Secret → write to disk
      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF
          echo "Keystore ready: $(ls -lh android/app/release.jks)"

      # Build APK — ignore "Already watching path" crash (flutter CLI bug in CI)
      # Gradle finishes the APK before the crash, so we just need to find it
      - name: Build APK
        run: flutter build apk --release 2>&1 | tee /tmp/build.log; exit 0

      - name: Locate and verify APK
        run: |
          echo "=== APK search ==="
          find . -name "*.apk" 2>/dev/null | sort

          APK=$(find . -name "*arm64*.apk" 2>/dev/null | grep -v debug | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "app-release.apk" 2>/dev/null | grep -v debug | head -1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | grep -v debug | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found. Build log:"
            cat /tmp/build.log
            exit 1
          fi

          echo "APK: $APK ($(du -sh $APK | cut -f1))"
          mkdir -p output
          cp "$APK" output/lan_scanner-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: output/lan_scanner-arm64.apk
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/


      - name: Create Git tag
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${{ github.event.inputs.tag }}`,
              sha: context.sha
            })

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: LAN Scanner ${{ github.event.inputs.tag }}
          body: |
            ## LAN Scanner ${{ github.event.inputs.tag }}

            ${{ github.event.inputs.release_notes }}

            ### 下载
            | 文件 | 说明 |
            |------|------|
            | `lan_scanner-arm64.apk` | Android arm64 正式签名版 |
            | `LanScanner-unsigned.ipa` | iOS 未签名（AltStore/Sideloadly 安装）|

            ### 功能
            - 输入 CIDR 网段扫描局域网所有在线设备
            - 自动填充当前 WiFi 网段
            - 自定义端口 / 默认扫描 13 个常用端口
            - 自动解析主机名，点击复制 IP
          files: |
            artifacts/lan_scanner-arm64.apk
            artifacts/LanScanner-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
