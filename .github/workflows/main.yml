name: Build APK & IPA

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # Run flutter build apk, ignore the "Already watching path" crash exit code
      # The APK is produced by Gradle BEFORE flutter CLI crashes
      - name: Build APK (ignore watcher crash)
        run: flutter build apk --release 2>&1 | tee /tmp/flutter_build.log; exit 0

      - name: Find APK
        run: |
          echo "=== All APK files ==="
          find . -name "*.apk" 2>/dev/null | sort
          echo "=== Build log tail ==="
          tail -20 /tmp/flutter_build.log
          
          APK=$(find . -name "app-release.apk" 2>/dev/null | grep -v debug | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | grep -v debug | head -1)
          fi
          
          if [ -z "$APK" ]; then
            echo "ERROR: APK not found anywhere"
            exit 1
          fi
          
          echo "Using APK: $APK ($(du -sh $APK | cut -f1))"
          mkdir -p output
          cp "$APK" output/lan_scanner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: output/lan_scanner.apk
          retention-days: 30


  release:
    name: Create Release
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: artifacts/ios

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android/lan_scanner.apk
            artifacts/ios/LanScanner-unsigned.ipa
          body: |
            ## LAN Scanner Release

            ### Android
            - `lan_scanner.apk` — 直接安装，支持所有架构

            ### iOS
            - `LanScanner-unsigned.ipa` — 未签名，使用 AltStore / Sideloadly 安装

            ### 功能
            - 输入 CIDR 网段扫描局域网设备（如 192.168.1.0/24）
            - 自动检测当前 WiFi 网段
            - 支持自定义端口，默认扫描 13 个常用端口
            - 自动解析设备主机名
            - 结果可导出分享
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
